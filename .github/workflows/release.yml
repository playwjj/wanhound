name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub: repository variable DOCKERHUB_USERNAME + secret
      # DOCKERHUB_TOKEN (an access token with Read & Write scope).
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/wanhound
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}

  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest stable patch release, not the go.mod minimum: release
          # binaries must not carry standard-library CVEs.
          go-version: stable
          check-latest: true
      - name: Build
        run: |
          mkdir dist
          for t in linux/amd64 linux/arm64 linux/arm/7 linux/386 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            IFS=/ read os arch arm <<< "$t"
            name=wanhound_${GITHUB_REF_NAME}_${os}_${arch}${arm:+v$arm}
            [ "$os" = windows ] && name=$name.exe
            GOOS=$os GOARCH=$arch GOARM=$arm CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o dist/$name ./cmd/wanhound
          done
          cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
