name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath -o wanhound ./cmd/wanhound

  # Unit and integration tests on the other release platforms: Winsock
  # and BSD socket error semantics differ from Linux.
  test-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Vet
        run: go vet ./...
      - name: Test
        # Failing test lines become annotations, readable without the log.
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:' test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

  # Acceptance bench: a container with known open/closed/filtered ports
  # (iptables DROP/REJECT inside its own namespace), audited end to end.
  testbed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Test bench
        run: make testbed
